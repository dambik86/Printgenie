<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintGenie — AI 3D Print Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080e;color:#f4f4f8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;font-size:16px;line-height:1.6}
body::before{content:'';position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:1000px;height:700px;background:radial-gradient(ellipse,#ff704310,transparent 65%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:36px 24px 90px}
.header{text-align:center;margin-bottom:44px}
.logo-row{display:inline-flex;align-items:center;gap:16px;margin-bottom:12px}
.logo-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#ff7043,#ff3d6e);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 10px 48px #ff704455}
.logo-text{font-size:48px;font-weight:900;letter-spacing:-3px;background:linear-gradient(90deg,#ff7043,#ffab76,#ffd97a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-family:'JetBrains Mono',monospace;font-size:13px;color:#606078;letter-spacing:5px;font-weight:600}
.lang{position:absolute;top:36px;right:24px;display:flex;background:#131320;border-radius:12px;overflow:hidden;border:1px solid #2e2e48}
.lang button{padding:11px 20px;border:none;background:transparent;color:#606078;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.2s;letter-spacing:1px}
.lang button.on{background:#ff7043;color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:40px;background:#131320;border-radius:18px;padding:7px;border:1px solid #2e2e48}
.tabs button{flex:1;padding:22px 16px;border:none;border-radius:13px;background:transparent;color:#606078;font-family:inherit;cursor:pointer;transition:.25s}
.tabs button.on{background:#1c1c30;color:#ff7043;box-shadow:0 4px 20px #0006,inset 0 0 0 1px #ff704325}
.tabs .tl{font-size:18px;font-weight:900}.tabs .td{font-size:13px;margin-top:5px;opacity:.6;font-weight:600}
.sec{display:none}.sec.on{display:block}
.input-tabs,.prof-tabs{display:flex;gap:4px;background:#131320;border-radius:14px;padding:5px;margin-bottom:22px;border:1px solid #2e2e48}
.input-tabs button,.prof-tabs button{flex:1;padding:14px;border:none;border-radius:10px;background:transparent;color:#606078;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.input-tabs button.on,.prof-tabs button.on{background:#1c1c30;color:#f4f4f8;box-shadow:0 2px 10px #0004}
.upload{border:3px dashed #3d3d5a;border-radius:22px;padding:56px 28px;text-align:center;cursor:pointer;background:#131320;margin-bottom:16px;transition:.3s;position:relative;overflow:hidden}
.upload:hover{border-color:#ff704450;background:#1c1c30}
.upload.has{padding:0;cursor:default}
.upload img{width:100%;max-height:320px;object-fit:cover;display:block;border-radius:20px}
.upload .chg{position:absolute;bottom:18px;right:18px;background:#08080edd;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:700;color:#ff7043;border:1px solid #ff704340;backdrop-filter:blur(12px);cursor:pointer}
.photo-ai-btn{width:100%;padding:20px;border:none;border-radius:14px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;margin-bottom:30px;transition:.3s;background:linear-gradient(135deg,#ff7043,#ff3d6e);color:#fff;box-shadow:0 8px 32px #ff704444;display:none;align-items:center;justify-content:center;gap:10px}
.photo-ai-btn.visible{display:flex}
.photo-ai-btn:hover{box-shadow:0 12px 44px #ff704466;transform:translateY(-2px)}
.photo-ai-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.describe-box,.smart-box{background:#131320;border-radius:22px;padding:28px;margin-bottom:30px;border:1px solid #2e2e48}
.describe-box textarea,.smart-box textarea{width:100%;min-height:140px;background:#1c1c30;border:2px solid #2e2e48;border-radius:16px;padding:20px;color:#f4f4f8;font-family:inherit;font-size:16px;line-height:1.7;resize:vertical;outline:none;transition:.2s}
.describe-box textarea:focus,.smart-box textarea:focus{border-color:#ff7043}
.describe-box textarea::placeholder,.smart-box textarea::placeholder{color:#606078}
.describe-hint,.smart-hint{font-size:13px;color:#b0b0c8;margin-top:14px;line-height:1.7;font-weight:500}
.ai-btn,.smart-ai-btn{width:100%;padding:20px;border:none;border-radius:14px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;margin-top:18px;transition:.3s;background:linear-gradient(135deg,#ff7043,#ff3d6e);color:#fff;box-shadow:0 8px 32px #ff704444;display:flex;align-items:center;justify-content:center;gap:10px}
.ai-btn:hover,.smart-ai-btn:hover{box-shadow:0 12px 44px #ff704466;transform:translateY(-2px)}
.ai-btn:disabled,.smart-ai-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.ai-spin{width:20px;height:20px;border:2.5px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.loading .ai-spin{display:block}
.ai-response,.smart-response{background:#1c1c30;border-radius:20px;border:1px solid #ff704328;padding:24px;margin-top:22px}
.ai-response-label,.smart-response-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:#ff7043;letter-spacing:3px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.ai-dot{width:9px;height:9px;border-radius:50%;background:#ff7043;animation:pulse 2s infinite}
.ai-response-text,.smart-response-text{font-size:16px;line-height:1.8;color:#b0b0c8}
.smart-response-text h3{color:#f4f4f8;font-size:16px;font-weight:800;margin:20px 0 10px;padding-top:16px;border-top:1px solid #2e2e48}
.smart-response-text h3:first-child{margin-top:0;padding-top:0;border-top:none}
.smart-response-text strong{color:#ff7043}
.smart-response-text ul{margin:8px 0;padding-left:20px}
.smart-response-text li{margin:6px 0}
.slbl{font-family:'JetBrains Mono',monospace;font-size:13px;color:#606078;letter-spacing:3.5px;font-weight:700;margin-bottom:18px;margin-top:10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.pcard{background:#1c1c30;border:2px solid #2e2e48;border-radius:20px;padding:24px 22px;cursor:pointer;text-align:left;transition:.25s;font-family:inherit;color:#f4f4f8}
.pcard:hover{border-color:#ff704450;transform:translateY(-3px);box-shadow:0 12px 36px #0007;background:#252540}
.pcard.sel{border-color:#ff7043;background:#252540}
.pcard .pi{font-size:40px;margin-bottom:14px}.pcard .pn{font-size:17px;font-weight:900}.pcard .pdesc{font-size:14px;color:#b0b0c8;margin-top:10px;line-height:1.7}
.pcard .ptag{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;padding:5px 14px;border-radius:8px}
.ptag.high{background:#ff5a7e18;color:#ff5a7e}.ptag.med{background:#fbbf2418;color:#fbbf24}
.anim-box{text-align:center;padding:60px 28px;background:#131320;border-radius:24px;border:1px solid #2e2e48;margin-top:28px}
.spinner{width:64px;height:64px;border:4px solid #252540;border-top-color:#ff7043;border-radius:50%;margin:0 auto 24px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.anim-title{font-size:22px;font-weight:900}.anim-sub{font-size:15px;color:#606078;margin-top:10px}
.steps{margin-top:30px;max-width:380px;margin-left:auto;margin-right:auto;text-align:left}
.step{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:15px;color:#606078;font-weight:600;transition:.3s}
.step.done{color:#4ade80}.step.act{color:#f4f4f8}
.step .dot{width:11px;height:11px;border-radius:50%;background:#252540;flex-shrink:0;transition:.3s}
.step.done .dot{background:#4ade80;box-shadow:0 0 14px #4ade8066}
.step.act .dot{background:#ff7043;animation:pulse 1s infinite}
.diag{margin-top:30px;background:#131320;border-radius:24px;border:1px solid #2e2e48;overflow:hidden}
.diag-head{padding:30px;background:linear-gradient(135deg,#ff704308,#5cb8ff06);border-bottom:1px solid #2e2e48;display:flex;align-items:center;gap:24px}
.ring{position:relative;width:110px;height:110px;flex-shrink:0}.ring svg{width:110px;height:110px}
.ring-v{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-n{font-size:32px;font-weight:900;color:#ff7043}.ring-l{font-family:'JetBrains Mono',monospace;font-size:9px;color:#606078;letter-spacing:2px}
.diag-tag{font-family:'JetBrains Mono',monospace;font-size:12px;color:#606078;letter-spacing:3px;margin-bottom:6px}
.diag-title{font-size:24px;font-weight:900}.diag-what{font-size:15px;color:#b0b0c8;margin-top:12px;line-height:1.7}
.csec,.fsec{padding:26px 30px}.csec{border-bottom:1px solid #2e2e48}
.clbl{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2.5px;font-weight:700;margin-bottom:18px}
.clbl.warn{color:#fbbf24}.clbl.fix{color:#5cb8ff}
.cause{display:flex;align-items:baseline;gap:12px;font-size:16px;color:#b0b0c8;margin-bottom:12px;line-height:1.6;font-weight:500}
.cause .cb{color:#fbbf24;opacity:.6;flex-shrink:0;font-size:22px}
.fcard{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;margin-bottom:10px;background:#1c1c30;border-radius:16px;border:1.5px solid #2e2e48;gap:16px}
.fcard:hover{border-color:#3d3d5a;background:#252540}
.fcard .fa{font-size:16px;font-weight:800}.fcard .fv{font-size:14px;color:#ff7043;margin-top:5px;font-weight:600;font-family:'JetBrains Mono',monospace}
.badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;padding:6px 14px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.badge-critical{background:#ff5a7e1a;color:#ff5a7e;border:1px solid #ff5a7e30}
.badge-high{background:#ff70431a;color:#ffab76;border:1px solid #ff704330}
.badge-medium{background:#fbbf241a;color:#fbbf24;border:1px solid #fbbf2430}
.badge-low{background:#4ade801a;color:#4ade80;border:1px solid #4ade8030}
.flbl{font-family:'JetBrains Mono',monospace;font-size:13px;color:#606078;letter-spacing:3.5px;font-weight:700;margin-bottom:14px;display:block}
.sel-w{position:relative;margin-bottom:28px}
.sel-w select{width:100%;padding:20px;background:#1c1c30;border:2px solid #2e2e48;border-radius:16px;color:#f4f4f8;font-family:inherit;font-size:16px;font-weight:600;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none}
.sel-w select:focus{border-color:#ff7043}
.sel-w .arr{position:absolute;right:22px;top:50%;transform:translateY(-50%);color:#606078;pointer-events:none}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.mcard{background:#1c1c30;border:2px solid #2e2e48;border-radius:18px;padding:20px 14px;cursor:pointer;text-align:center;transition:.25s;font-family:inherit;color:#f4f4f8}
.mcard:hover{border-color:#ff704444;transform:translateY(-2px);background:#252540}
.mcard.sel{border-color:#ff7043;background:#252540}
.mcard .mi{font-size:32px}.mcard .mn{font-size:16px;font-weight:900;margin-top:8px}.mcard .md{font-size:12px;color:#606078;margin-top:5px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:32px}
.gcard{background:#1c1c30;border:2px solid #2e2e48;border-radius:18px;padding:22px 20px;cursor:pointer;text-align:left;transition:.25s;font-family:inherit;color:#f4f4f8}
.gcard:hover{border-color:#ff704444;transform:translateY(-2px);background:#252540}
.gcard.sel{border-color:#ff7043;background:#252540}
.gcard .gi{font-size:32px;margin-bottom:10px}.gcard .gl{font-size:16px;font-weight:900}.gcard .gd{font-size:13px;color:#606078;margin-top:6px}
.gen-btn{width:100%;padding:24px;border:none;border-radius:18px;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;transition:.3s;margin-bottom:32px}
.gen-btn.off{background:#1c1c30;color:#606078;cursor:default;border:2px solid #2e2e48}
.gen-btn.ready{background:linear-gradient(135deg,#ff7043,#ff3d6e);color:#fff;box-shadow:0 10px 40px #ff704444;border:none}
.gen-btn.ready:hover{transform:translateY(-3px)}
.prof{background:#131320;border-radius:24px;border:1px solid #2e2e48;overflow:hidden}
.prof-head{padding:26px 30px;background:linear-gradient(135deg,#ff704308,#5cb8ff06);border-bottom:1px solid #2e2e48}
.prof-tag{font-family:'JetBrains Mono',monospace;font-size:12px;color:#606078;letter-spacing:3px}
.prof-title{font-size:22px;font-weight:900;margin-top:8px}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:24px 30px;border-bottom:1px solid #2e2e48}
.tcard{border-radius:18px;padding:22px}.tnoz{background:linear-gradient(135deg,#ff704314,#ff3d6e0a);border:1px solid #ff704322}.tbed{background:linear-gradient(135deg,#5cb8ff14,#4ade800a);border:1px solid #5cb8ff22}
.tcard .tl{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2.5px;font-weight:700}
.tnoz .tl{color:#ff7043}.tbed .tl{color:#5cb8ff}
.tcard .tv{font-size:32px;font-weight:900;margin-top:10px}.tnoz .tv{color:#ffab76}.tbed .tv{color:#5cb8ff}
.psec{padding:24px 30px}.plbl{font-family:'JetBrains Mono',monospace;font-size:13px;color:#ff7043;letter-spacing:2.5px;font-weight:700;margin-bottom:20px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;margin-bottom:6px;border-radius:12px}
.prow:nth-child(odd){background:#1c1c30}
.prow .pk{font-size:15px;color:#b0b0c8}.prow .pv{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace}
.exports{padding:0 30px 30px;display:flex;gap:12px;flex-wrap:wrap}
.ebtn{flex:1;min-width:160px;padding:20px 16px;background:#1c1c30;border:2px solid #2e2e48;border-radius:16px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:#ff7043;transition:.2s;text-align:center}
.ebtn:hover{border-color:#ff7043;background:#252540;transform:translateY(-2px)}
.footer{text-align:center;margin-top:60px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#606078;letter-spacing:2px;opacity:.3}
.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(100px);background:#252540;color:#ff7043;padding:20px 40px;border-radius:18px;border:1px solid #ff704330;font-family:inherit;font-size:16px;font-weight:700;box-shadow:0 16px 60px #000a;z-index:100;transition:transform .4s cubic-bezier(.18,.89,.32,1.28);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.pgrid,.ggrid{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr 1fr}.logo-text{font-size:34px}.temps{grid-template-columns:1fr}.exports{flex-direction:column}.diag-head{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<div class="app">
<div class="lang"><button class="on" id="lcs" onclick="doLang('cs')">CZ</button><button id="len" onclick="doLang('en')">EN</button></div>
<div class="header"><div class="logo-row"><div class="logo-icon">&#x1F9DE;</div><span class="logo-text">PrintGenie</span></div><div class="subtitle" id="h-sub"></div></div>
<div class="tabs"><button class="on" id="t-doc" onclick="doTab('doc')"><div class="tl" id="t-doc-l"></div><div class="td" id="t-doc-d"></div></button><button id="t-prof" onclick="doTab('prof')"><div class="tl" id="t-prof-l"></div><div class="td" id="t-prof-d"></div></button></div>
<div class="sec on" id="s-doc">
  <div class="input-tabs"><button class="on" id="itab-photo" onclick="doInputTab('photo')">&#x1F4F8; <span id="itab-photo-l"></span></button><button id="itab-desc" onclick="doInputTab('desc')">&#x1F4AC; <span id="itab-desc-l"></span></button></div>
  <div id="input-photo">
    <div class="upload" id="upzone" onclick="document.getElementById('finput').click()"><input type="file" id="finput" accept="image/*" style="display:none" onchange="doUpload(event)"><div id="up-ph"><div style="font-size:60px;margin-bottom:18px">&#x1F4F8;</div><div style="font-size:18px;font-weight:800" id="up-t"></div><div style="font-size:15px;color:#606078;margin-top:10px" id="up-s"></div></div><div id="up-pv" style="display:none"><img id="up-img" src="" alt=""><div class="chg" id="up-chg" onclick="event.stopPropagation();document.getElementById('finput').click()"></div></div></div>
    <button class="photo-ai-btn" id="photo-ai-btn" onclick="doPhotoAnalyze()"><span class="ai-spin"></span><span id="photo-btn-text"></span></button>
    <div id="photo-response-area"></div>
  </div>
  <div id="input-desc" style="display:none"><div class="describe-box"><textarea id="desc-input" rows="5"></textarea><div class="describe-hint" id="desc-hint"></div><button class="ai-btn" id="ai-analyze-btn" onclick="doAIAnalyze()"><span class="ai-spin"></span><span id="ai-btn-text"></span></button></div><div id="ai-response-area"></div></div>
  <div class="slbl" id="lbl-or"></div><div class="pgrid" id="pgrid"></div><div id="doc-out"></div>
</div>
<div class="sec" id="s-prof">
  <div class="prof-tabs"><button class="on" id="ptab-manual" onclick="doProfTab('manual')">&#x2699;&#xFE0F; <span id="ptab-manual-l"></span></button><button id="ptab-smart" onclick="doProfTab('smart')">&#x1F9E0; <span id="ptab-smart-l"></span></button></div>
  <div id="prof-manual">
    <label class="flbl" id="lbl-printer"></label><div class="sel-w"><select id="sel-printer" onchange="doProfChange()"></select><span class="arr">&#x25BC;</span></div>
    <label class="flbl" id="lbl-mat"></label><div class="mgrid" id="mgrid"></div>
    <label class="flbl" id="lbl-goal"></label><div class="ggrid" id="ggrid"></div>
    <button class="gen-btn off" id="gen-btn" onclick="doGenProfile()"></button><div id="prof-out"></div>
  </div>
  <div id="prof-smart" style="display:none">
    <div class="slbl" id="smart-title"></div>
    <div class="smart-box"><textarea id="smart-input" rows="6"></textarea><div class="smart-hint" id="smart-hint-text"></div><button class="smart-ai-btn" id="smart-ai-btn" onclick="doSmartAnalyze()"><span class="ai-spin"></span><span id="smart-btn-text"></span></button></div>
    <div id="smart-out"></div>
  </div>
</div>
<div class="footer">PrintGenie v0.4 &#x2014; AI-Powered &#x2014; &#x00A9; 2026</div>
</div>
<div class="toast" id="toast"></div>
<script>

var PRINTERS=["Creality Ender 3 V3","Creality Ender 3 V3 SE","Creality K1","Creality K1 Max","Prusa MK4S","Prusa MK3S+","Prusa Mini+","Prusa XL","Bambu Lab A1 Mini","Bambu Lab A1","Bambu Lab P1S","Bambu Lab X1C","Anycubic Kobra 3","Voron 2.4","Voron Trident","Artillery Sidewinder X4","Elegoo Neptune 4 Pro","Sovol SV08","Qidi X-Max 3"];

function applyLang(){var ids=[["h-sub","sub"],["t-doc-l","doc_l"],["t-doc-d","doc_d"],["t-prof-l","prof_l"],["t-prof-d","prof_d"],["up-t","up_t"],["up-s","up_s"],["up-chg","chg"],["lbl-or","or_lbl"],["lbl-printer","printer"],["lbl-mat","mat"],["lbl-goal","goal"],["itab-photo-l","itab_photo"],["itab-desc-l","itab_desc"],["desc-hint","desc_hint"],["ai-btn-text","ai_btn"],["ptab-manual-l","prof_mode_manual"],["ptab-smart-l","prof_mode_smart"],["smart-title","smart_title"],["smart-hint-text","smart_hint"],["smart-btn-text","smart_btn"],["photo-btn-text","photo_btn"]];for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i][0]);if(el)el.textContent=s(ids[i][1])}document.getElementById("desc-input").placeholder=s("desc_placeholder");document.getElementById("smart-input").placeholder=s("smart_placeholder");updateGenBtn()}
function fillPrinters(){var sel=document.getElementById("sel-printer"),v=sel.value;sel.innerHTML='<option value="">'+s("sel0")+'</option>';for(var i=0;i<PRINTERS.length;i++)sel.innerHTML+='<option value="'+PRINTERS[i]+'">'+PRINTERS[i]+'</option>';sel.value=v}
window.doInputTab=function(m){document.getElementById("itab-photo").className=(m==="photo")?"on":"";document.getElementById("itab-desc").className=(m==="desc")?"on":"";document.getElementById("input-photo").style.display=(m==="photo")?"block":"none";document.getElementById("input-desc").style.display=(m==="desc")?"block":"none"};

window.doTab=function(tb){document.getElementById("t-doc").className=(tb==="doc")?"on":"";document.getElementById("t-prof").className=(tb==="prof")?"on":"";document.getElementById("s-doc").className="sec"+(tb==="doc"?" on":"");document.getElementById("s-prof").className="sec"+(tb==="prof"?" on":"")};
window.doUpload=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var dataUrl=ev.target.result;uploadedB64=dataUrl.split(",")[1];document.getElementById("upzone").classList.add("has");document.getElementById("up-ph").style.display="none";document.getElementById("up-pv").style.display="block";document.getElementById("up-img").src=dataUrl;document.getElementById("photo-ai-btn").classList.add("visible");curDiag=null;document.getElementById("doc-out").innerHTML="";document.getElementById("photo-response-area").innerHTML=""};r.readAsDataURL(f)};

// PHOTO AI ANALYSIS
window.doPhotoAnalyze=function(){if(!uploadedB64)return;var btn=document.getElementById("photo-ai-btn");btn.disabled=true;btn.classList.add("loading");document.getElementById("photo-btn-text").textContent=s("photo_btn_loading");document.getElementById("photo-response-area").innerHTML="";document.getElementById("doc-out").innerHTML="";var sysP="You are PrintGenie, the world's best FDM 3D printing troubleshooting AI with vision capabilities. You draw from expert knowledge of Reddit communities, Prusa Knowledge Base, Bambu Lab Wiki, Voron docs, Klipper/Marlin firmware, all major slicer documentation, E3D guides, Teaching Tech and CNC Kitchen research, and manufacturer troubleshooting for Creality, Prusa, Bambu Lab, Voron, Anycubic and others. Analyze this photo of a 3D print. You MUST respond ENTIRELY in "+(lang==="cs"?"Czech language (čeština). Every single word of your response must be in Czech, including all technical terms where Czech equivalents exist.":"English language.")+". Return ONLY valid JSON (no markdown fences): {\"problem_id\": \"warping|stringing|layer_shift|underextrusion|overextrusion|adhesion|blobs|bridging|ghosting|elephant_foot|layer_separation|zbanding|pillowing|clogged_nozzle|spaghetti|dimensional|other\", \"confidence\": 70-99, \"html\": \"<full HTML analysis>\"}. The html field must contain rich HTML with these sections using h3 tags: 1) WHAT I SEE - describe exactly what defects are visible in the photo. 2) DIAGNOSIS - identify the specific problem(s) and explain why you think so. 3) ROOT CAUSES - probable causes ranked by likelihood. 4) STEP-BY-STEP FIX - numbered steps with exact parameter values. Each step explains WHY. 5) QUICK CHECKLIST - summary of most important fixes. Use strong tags, ul/li lists. Be specific with numbers.";
var imgType="image/jpeg";if(uploadedB64.substring(0,4)==="iVBO")imgType="image/png";
fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"gpt-4o",max_tokens:2500,messages:[{role:"system",content:sysP},{role:"user",content:[{type:"image_url",image_url:{url:"data:"+imgType+";base64,"+uploadedB64}},{type:"text",text:"Analyze this 3D print photo. What defect do you see?"}]}]})}).then(function(r){return r.json()}).then(function(data){btn.disabled=false;btn.classList.remove("loading");document.getElementById("photo-btn-text").textContent=s("photo_btn");var text="";if(data.choices&&data.choices[0])text=data.choices[0].message.content||"";try{var clean=text.replace(/```json|```/g,"").trim();var result=JSON.parse(clean);document.getElementById("photo-response-area").innerHTML='<div class="smart-response"><div class="smart-response-label"><span class="ai-dot"></span>'+s("ai_label")+'</div><div class="smart-response-text">'+(result.html||escH(result.analysis||""))+'</div></div>';if(result.problem_id&&PROB_IDS.indexOf(result.problem_id)!==-1){selProb=result.problem_id;renderProbs();if(DIAG[result.problem_id])DIAG[result.problem_id]._ac=result.confidence;doSelectProb(result.problem_id)}}catch(err){document.getElementById("photo-response-area").innerHTML='<div class="ai-response"><div class="ai-response-label"><span class="ai-dot"></span>'+s("ai_label")+'</div><div class="ai-response-text">'+escH(text||"Error")+'</div></div>'}}).catch(function(err){btn.disabled=false;btn.classList.remove("loading");document.getElementById("photo-btn-text").textContent=s("photo_btn");document.getElementById("photo-response-area").innerHTML='<div class="ai-response"><div class="ai-response-text" style="color:#ff5a7e">'+escH(err.message)+'</div></div>'})};

// TEXT AI ANALYSIS
window.doAIAnalyze=function(){var input=document.getElementById("desc-input").value.trim();if(!input||input.length<10)return;var btn=document.getElementById("ai-analyze-btn");btn.disabled=true;btn.classList.add("loading");document.getElementById("ai-btn-text").textContent=s("ai_btn_loading");document.getElementById("ai-response-area").innerHTML="";document.getElementById("doc-out").innerHTML="";var sysP="You are PrintGenie, the world's best FDM 3D printing troubleshooting AI. You have deep expert knowledge from all major 3D printing communities: Reddit (r/3Dprinting, r/ender3, r/prusa3d, r/BambuLab, r/klippers), Prusa Knowledge Base, Bambu Lab Wiki, Voron Design documentation, Klipper and Marlin firmware docs, Cura/PrusaSlicer/OrcaSlicer documentation, E3D and Slice Engineering guides, research by Teaching Tech and CNC Kitchen, and official manufacturer troubleshooting guides for Creality, Prusa, Bambu Lab, Voron, Anycubic, Artillery, Elegoo, and Qidi. You know every printer-specific quirk, every firmware setting, every slicer trick. The user describes a problem with their 3D print. Provide a COMPREHENSIVE diagnosis. You MUST respond ENTIRELY in "+(lang==="cs"?"Czech language (čeština). Every single word of your response must be in Czech, including all technical terms where Czech equivalents exist.":"English language.")+". Return ONLY valid JSON (no markdown fences): {\"problem_id\": \"warping|stringing|layer_shift|underextrusion|overextrusion|adhesion|blobs|bridging|ghosting|elephant_foot|layer_separation|zbanding|pillowing|clogged_nozzle|spaghetti|dimensional|other\", \"confidence\": 70-99, \"html\": \"<full HTML analysis>\"}. The html field must contain rich HTML with these sections using h3 tags: 1) PROBLEM IDENTIFICATION - what the problem is, visual description of how it typically looks on a print so user can confirm. 2) ROOT CAUSE ANALYSIS - all probable causes ranked by likelihood with explanations. 3) STEP-BY-STEP SOLUTION - numbered steps with exact parameter values (temperatures in C, speeds in mm/s, distances in mm). Each step explains WHY it helps. 4) PREVENTION - how to avoid this in the future. 5) QUICK CHECKLIST - a summary checklist of the most important fixes. Use strong tags for emphasis, ul/li for lists. Be extremely specific with numbers and values. If the user mentions their printer/material, tailor advice to that specific setup.";fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"gpt-4o",max_tokens:2500,messages:[{role:"system",content:sysP},{role:"user",content:input}]})}).then(function(r){return r.json()}).then(function(data){btn.disabled=false;btn.classList.remove("loading");document.getElementById("ai-btn-text").textContent=s("ai_btn");var text="";if(data.choices&&data.choices[0])text=data.choices[0].message.content||"";try{var clean=text.replace(/```json|```/g,"").trim();var result=JSON.parse(clean);document.getElementById("ai-response-area").innerHTML='<div class="smart-response"><div class="smart-response-label"><span class="ai-dot"></span>'+s("ai_label")+'</div><div class="smart-response-text">'+(result.html||escH(result.analysis||""))+'</div></div>';if(result.problem_id&&PROB_IDS.indexOf(result.problem_id)!==-1){selProb=result.problem_id;renderProbs();if(DIAG[result.problem_id])DIAG[result.problem_id]._ac=result.confidence;doSelectProb(result.problem_id)}}catch(err){document.getElementById("ai-response-area").innerHTML='<div class="ai-response"><div class="ai-response-label"><span class="ai-dot"></span>'+s("ai_label")+'</div><div class="ai-response-text">'+escH(text||"Error")+'</div></div>'}}).catch(function(err){btn.disabled=false;btn.classList.remove("loading");document.getElementById("ai-btn-text").textContent=s("ai_btn");document.getElementById("ai-response-area").innerHTML='<div class="ai-response"><div class="ai-response-text" style="color:#ff5a7e">'+escH(err.message)+'</div></div>'})};

// SMART ADVISOR
window.doSmartAnalyze=function(){var input=document.getElementById("smart-input").value.trim();if(!input||input.length<15)return;var btn=document.getElementById("smart-ai-btn");btn.disabled=true;btn.classList.add("loading");document.getElementById("smart-btn-text").textContent=s("smart_btn_loading");document.getElementById("smart-out").innerHTML="";var sysP="You are PrintGenie Smart Advisor for FDM 3D printing. User describes what they want to print. You MUST respond ENTIRELY in "+(lang==="cs"?"Czech language (čeština). Every word must be in Czech.":"English.")+" using HTML (h3, strong, ul/li). Sections: 1) RECOMMENDED MATERIAL - which and why. 2) ORIENTATION ON BUILD PLATE - how to position for best results. 3) SUPPORT SETTINGS - type (tree/normal/none), density %, Z-distance, XY-distance, interface layers, pattern, removal tips. 4) PRINT PARAMETERS - layer height, temps, speed, infill %, pattern, walls, fan. 5) TIPS FOR PERFECT PRINT - 3-5 specific tips. Be very specific with numbers. No markdown code blocks.";fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"gpt-4o",max_tokens:2000,messages:[{role:"system",content:sysP},{role:"user",content:input}]})}).then(function(r){return r.json()}).then(function(data){btn.disabled=false;btn.classList.remove("loading");document.getElementById("smart-btn-text").textContent=s("smart_btn");var text="";if(data.choices&&data.choices[0])text=data.choices[0].message.content||"";var clean=text.replace(/```html|```/g,"").trim();document.getElementById("smart-out").innerHTML='<div class="smart-response"><div class="smart-response-label"><span class="ai-dot"></span>'+s("smart_label")+'</div><div class="smart-response-text">'+clean+'</div></div>'}).catch(function(err){btn.disabled=false;btn.classList.remove("loading");document.getElementById("smart-btn-text").textContent=s("smart_btn");document.getElementById("smart-out").innerHTML='<div class="smart-response"><div class="smart-response-text" style="color:#ff5a7e">'+escH(err.message)+'</div></div>'})};

function escH(str){var d=document.createElement("div");d.textContent=str;return d.innerHTML}
function renderProbs(){var g=document.getElementById("pgrid");g.innerHTML="";for(var i=0;i<PROB_IDS.length;i++){var pid=PROB_IDS[i],c=document.createElement("button");c.className="pcard"+(selProb===pid?" sel":"");c.innerHTML='<div class="pi">'+PROB_ICONS[i]+'</div><div class="pn">'+s("prob_names")[i]+'</div><div class="pdesc">'+s("prob_descs")[i]+'</div><span class="ptag '+PROB_SEV[i]+'">'+(PROB_SEV[i]==="high"?s("sev_high"):s("sev_med"))+'</span>';c.addEventListener("click",(function(id){return function(){doSelectProb(id)}})(pid));g.appendChild(c)}}
function doSelectProb(id){selProb=id;renderProbs();var out=document.getElementById("doc-out");var st=s("steps");var h='<div class="anim-box"><div class="spinner"></div><div class="anim-title">'+s("atit")+'</div><div class="anim-sub">'+s("asub")+'</div><div class="steps">';for(var i=0;i<st.length;i++)h+='<div class="step" id="as'+i+'"><div class="dot"></div><span>'+st[i]+'</span></div>';h+='</div></div>';out.innerHTML=h;var step=0;var iv=setInterval(function(){if(step>0)document.getElementById("as"+(step-1)).className="step done";if(step<4)document.getElementById("as"+step).className="step act";step++;if(step>4){clearInterval(iv);curDiag=id;showDiag(id)}},600)}
function showDiag(id){var d=DIAG[id];if(!d)return;var idx=PROB_IDS.indexOf(id);var conf=d._ac||d.conf;var circ=2*Math.PI*44,off=circ-(conf/100)*circ;var h='<div class="diag"><div class="diag-head"><div class="ring"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="44" fill="none" stroke="#1c1c30" stroke-width="5"/><circle cx="55" cy="55" r="44" fill="none" stroke="#ff7043" stroke-width="5" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" stroke-linecap="round" transform="rotate(-90 55 55)" style="transition:stroke-dashoffset 1s"/></svg><div class="ring-v"><span class="ring-n">'+conf+'%</span><span class="ring-l">'+s("clbl")+'</span></div></div><div><div class="diag-tag">'+s("dtag")+'</div><div class="diag-title">'+s("prob_names")[idx]+'</div><div class="diag-what">'+s("prob_descs")[idx]+'</div></div></div>';h+='<div class="csec"><div class="clbl warn">'+s("clb")+'</div>';var cs=d.c[lang];for(var i=0;i<cs.length;i++)h+='<div class="cause"><span class="cb">&rsaquo;</span>'+cs[i]+'</div>';h+='</div><div class="fsec"><div class="clbl fix">'+s("flb")+'</div>';var fs=d.f[lang];for(var j=0;j<fs.length;j++){var fx=fs[j];h+='<div class="fcard"><div><div class="fa">'+fx[0]+'</div><div class="fv">'+fx[1]+'</div></div><span class="badge badge-'+fx[2]+'">'+s("b_"+fx[2])+'</span></div>'}h+='</div></div>';document.getElementById("doc-out").innerHTML=h;delete d._ac}
function renderMats(){var g=document.getElementById("mgrid");g.innerHTML="";for(var i=0;i<MATS.length;i++){var m=MATS[i],c=document.createElement("button");c.className="mcard"+(selMat===m.n?" sel":"");c.innerHTML='<div class="mi">'+m.i+'</div><div class="mn">'+m.n+'</div><div class="md">'+s("mats")[i]+'</div>';c.addEventListener("click",(function(n){return function(){selMat=n;curProf=null;renderMats();updateGenBtn();document.getElementById("prof-out").innerHTML=""}})(m.n));g.appendChild(c)}}
function renderGoals(){var g=document.getElementById("ggrid");g.innerHTML="";for(var i=0;i<GOAL_IDS.length;i++){var gid=GOAL_IDS[i],c=document.createElement("button");c.className="gcard"+(selGoal===gid?" sel":"");c.innerHTML='<div class="gi">'+GOAL_ICONS[i]+'</div><div class="gl">'+s("goals")[i][0]+'</div><div class="gd">'+s("goals")[i][1]+'</div>';c.addEventListener("click",(function(id){return function(){selGoal=id;curProf=null;renderGoals();updateGenBtn();document.getElementById("prof-out").innerHTML=""}})(gid));g.appendChild(c)}}
function updateGenBtn(){var b=document.getElementById("gen-btn");var ok=document.getElementById("sel-printer").value&&selMat&&selGoal;b.className="gen-btn "+(ok?"ready":"off");b.textContent=s("gen")}
window.doProfChange=function(){curProf=null;document.getElementById("prof-out").innerHTML="";updateGenBtn()};
window.doGenProfile=function(){var pr=document.getElementById("sel-printer").value;if(!pr||!selMat||!selGoal)return;var b=document.getElementById("gen-btn");b.textContent=s("gening");b.className="gen-btn off";setTimeout(function(){curProf=true;showProfile();b.textContent=s("gen");b.className="gen-btn ready"},1500)};
function showProfile(){var pr=document.getElementById("sel-printer").value;var p=PROFILES[selGoal],tm=TEMPS[selMat];if(!p||!tm)return;var gl=s("goals")[GOAL_IDS.indexOf(selGoal)][0];var vals=[p.lh+" mm",p.sp+" mm/s",p.inf+" %",p.ip,p.w,p.tl,p.bl,p.f+" %",s("sup")[p.si],p.rd+" mm",p.rs+" mm/s",p.ac+" mm/s\u00b2",p.fl+" mm/s",p.zh+" mm"];var keys=s("pk");var h='<div class="prof"><div class="prof-head"><div class="prof-tag">'+s("ptag")+'</div><div class="prof-title">'+pr+' \u00b7 '+selMat+' \u00b7 '+gl+'</div></div><div class="temps"><div class="tcard tnoz"><div class="tl">'+s("noz")+'</div><div class="tv">'+tm[0]+'\u2013'+tm[1]+' \u00b0C</div></div><div class="tcard tbed"><div class="tl">'+s("bed")+'</div><div class="tv">'+tm[2]+'\u2013'+tm[3]+' \u00b0C</div></div></div><div class="psec"><div class="plbl">'+s("par")+'</div>';for(var i=0;i<keys.length;i++)h+='<div class="prow"><span class="pk">'+keys[i]+'</span><span class="pv">'+vals[i]+'</span></div>';h+='</div><div class="exports"><button class="ebtn" onclick="doExpClip()">'+s("ec")+'</button><button class="ebtn" onclick="doExpINI()">'+s("ei")+'</button><button class="ebtn" onclick="doExpCura()">'+s("ecu")+'</button></div></div>';document.getElementById("prof-out").innerHTML=h}
function gpt(){var pr=document.getElementById("sel-printer").value,p=PROFILES[selGoal],tm=TEMPS[selMat],gl=s("goals")[GOAL_IDS.indexOf(selGoal)][0];return"# PrintGenie\n# "+pr+" | "+selMat+" | "+gl+"\nNozzle: "+tm[0]+"-"+tm[1]+"C\nBed: "+tm[2]+"-"+tm[3]+"C\nLayer: "+p.lh+"mm\nSpeed: "+p.sp+"mm/s\nInfill: "+p.inf+"% "+p.ip+"\nWalls: "+p.w+"\nRetract: "+p.rd+"mm@"+p.rs+"mm/s"}
function gini(){var p=PROFILES[selGoal],tm=TEMPS[selMat];return"; PrintGenie\n[print:PG_"+selGoal+"_"+selMat+"]\nlayer_height="+p.lh+"\nperimeters="+p.w+"\nfill_density="+p.inf+"%\nperimeter_speed="+p.sp+"\n[filament:"+selMat+"]\ntemperature="+tm[0]+"\nbed_temperature="+tm[2]+"\nfilament_retract_length="+p.rd}
function gcura(){var p=PROFILES[selGoal],tm=TEMPS[selMat];return JSON.stringify({name:"PG_"+selGoal+"_"+selMat,settings:{layer_height:+p.lh,speed_print:+p.sp,infill_sparse_density:+p.inf,wall_line_count:+p.w,material_print_temperature:tm[0],material_bed_temperature:tm[2],retraction_amount:+p.rd,cool_fan_speed:+p.f}},null,2)}
window.doExpClip=function(){navigator.clipboard.writeText(gpt()).then(function(){showToast(s("tc"))})};
window.doExpINI=function(){dlF("PG_"+selGoal+"_"+selMat+".ini",gini());showToast(s("td_msg"))};
window.doExpCura=function(){dlF("PG_"+selGoal+"_"+selMat+".curaprofile",gcura());showToast(s("td_msg"))};
function dlF(n,c){var b=new Blob([c],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click()}
function showToast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},2500)}
applyLang();renderProbs();renderMats();renderGoals();fillPrinters();
})();
</script>
