var aiChatHistory=[];
function cleanAIHtml(text){
  text = String(text || "");
  return text.replace(/```html|```json|```/g,"").trim();
}
function aiFallbackAnswer(userText){
  var lower = String(userText || "").toLowerCase();
  if(lang === "cs"){
    var base = "<h3>Rychlá diagnostika</h3>";
    if(lower.indexOf("string")>-1 || lower.indexOf("vlákn")>-1){
      base += "<p><strong>Nejpravděpodobnější příčina:</strong> příliš vysoká teplota trysky, slabá retrakce nebo vlhký filament.</p><ul><li>Sniž teplotu trysky po 5 °C, typicky PLA z 210 °C na 200–205 °C.</li><li>Ověř retrakci: Bowden cca 4–6 mm při 35–45 mm/s, direct drive cca 0,6–1,2 mm při 25–40 mm/s.</li><li>Zvyš travel speed na 150–200 mm/s a zkontroluj combing.</li><li>PLA případně vysuš 4–6 hodin při 45–50 °C.</li></ul><p><strong>Doplň mi:</strong> tiskárnu, filament, retrakci a rychlost tisku.</p>";
    } else if(lower.indexOf("warp")>-1 || lower.indexOf("roh")>-1 || lower.indexOf("zved")>-1){
      base += "<p><strong>Nejpravděpodobnější příčina:</strong> špatná adheze první vrstvy, chladnutí materiálu nebo nízká teplota podložky.</p><ul><li>Vyčisti podložku IPA / jarovou vodou podle typu povrchu.</li><li>Zkontroluj Z-offset.</li><li>Přidej brim 6–10 mm.</li><li>PLA 55–65 °C, PETG 75–85 °C, ABS/ASA 95–110 °C + enclosure.</li></ul>";
    } else {
      base += "<p>Potřebuji pár detailů, abych šel přesně po příčině:</p><ol><li>Jaká tiskárna?</li><li>Jaký filament?</li><li>Teplota trysky a podložky?</li><li>Rychlost tisku a slicer?</li></ol><p>Pošli tyto hodnoty a navrhnu konkrétní opravu krok za krokem.</p>";
    }
    return base;
  }
  return "<h3>Quick diagnosis</h3><p>I need printer, filament, nozzle/bed temperature and print speed to diagnose precisely. Send these values and I will continue step by step.</p>";
}
function extractAIText(data){
  if(!data) return "";
  if(data.choices && data.choices[0] && data.choices[0].message) return data.choices[0].message.content || "";
  if(data.message) return data.message;
  if(data.error) return data.error.message || data.error;
  return "";
}

function addAIChatMessage(role, htmlText){
  var log=document.getElementById("ai-chat-log");
  if(!log) return;
  var div=document.createElement("div");
  div.className="ai-msg "+(role==="user"?"user":"bot");
  div.innerHTML = role==="user" ? escH(htmlText) : cleanAIHtml(htmlText);
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}
function startAIChat(userProblem, firstAnswer){
  var box=document.getElementById("ai-chat-box");
  var log=document.getElementById("ai-chat-log");
  if(!box || !log) return;
  applyChatLang();
  box.style.display="block";
  log.innerHTML="";
  aiChatHistory=[
    {role:"system",content:"You are PrintGenie AI, an elite senior FDM 3D printing technician. Continue the diagnostic conversation naturally. Ask only the most useful follow-up questions, explain the reason, and give precise slicer/printer values. Do not claim live internet browsing. Respond in "+(lang==="cs"?"Czech.":"English.")},
    {role:"user",content:userProblem || ""}
  ];
  addAIChatMessage("bot", lang==="cs" ? "Ahoj! Jsem tvůj AI technik pro 3D tisk.<br>Pomůžu ti přesně najít příčinu problému.<br>Mohu se tě na pár věcí doptat? 🙂" : "Hi! I am your AI technician for 3D printing.<br>I will help you find the cause precisely.");
  addAIChatMessage("user", userProblem || "");
  addAIChatMessage("bot", firstAnswer || aiFallbackAnswer(userProblem));
  aiChatHistory.push({role:"assistant",content:(firstAnswer || aiFallbackAnswer(userProblem)).replace(/<[^>]+>/g," ")});

  window.scrollTo({top:boxY,behavior:"smooth"});
}
window.sendAIChat=function(){
  var input=document.getElementById("ai-chat-input");
  var btn=document.getElementById("ai-chat-send");
  if(!input || !input.value.trim()) return;
  var text=input.value.trim();
  input.value="";
  addAIChatMessage("user", text);
  aiChatHistory.push({role:"user",content:text});
  var thinking=document.createElement("div");
  thinking.className="ai-msg bot";
  thinking.id="ai-thinking-msg";
  thinking.innerHTML=lang==="cs" ? "Přemýšlím… <strong>•••</strong>" : "Thinking… <strong>•••</strong>";
  document.getElementById("ai-chat-log").appendChild(thinking);
  document.getElementById("ai-chat-log").scrollTop=999999;
  if(btn) btn.disabled=true;
  fetch("/api/analyze",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"gpt-4o",max_tokens:1400,messages:aiChatHistory})
  }).then(function(r){return r.json()}).then(function(data){
    if(btn) btn.disabled=false;
    var t=document.getElementById("ai-thinking-msg"); if(t)t.remove();
    var answer=extractAIText(data);
    if(!answer || (data && data.error)) answer=aiFallbackAnswer(text);
    addAIChatMessage("bot", answer);
    aiChatHistory.push({role:"assistant",content:String(answer).replace(/<[^>]+>/g," ")});
  }).catch(function(){
    if(btn) btn.disabled=false;
    var t=document.getElementById("ai-thinking-msg"); if(t)t.remove();
    var answer=aiFallbackAnswer(text);
    addAIChatMessage("bot", answer);
    aiChatHistory.push({role:"assistant",content:String(answer).replace(/<[^>]+>/g," ")});
  });
};

    ["Regular horizontal bands on walls.","Pravidelné horizontální pruhy na stěnách."],
    ["Pillowing – holes in top layer","Pillowing – díry v horní vrstvě"],
    ["Holes or an unclosed top surface.","Díry nebo neuzavřený horní povrch."],
    ["Clogged nozzle / Heat creep","Ucpaná tryska / Heat creep"],
    ["The nozzle is partially or fully clogged.","Tryska se ucpe částečně nebo úplně."],
    ["Spaghetti – complete print failure","Špagety – kompletní selhání tisku"],
    ["The print collapses into spaghetti.","Tisk se zhroutí do špaget."],
    ["Dimensional inaccuracy","Rozměrová nepřesnost"],
    ["Printed dimensions do not match the model.","Rozměry výtisku nesedí s modelem."],
    ["Common issue","Častý problém"],
    ["Medium","Střední"]
  ];

  function currentLang(){
    const en = document.getElementById("len");
    const cs = document.getElementById("lcs");
    if(en && (en.classList.contains("on") || en.classList.contains("active"))) return "en";
    if(cs && (cs.classList.contains("on") || cs.classList.contains("active"))) return "cs";
    return (window.lang === "en") ? "en" : "cs";
  }

  function replaceList(str, list){
    let out = String(str || "");
    list.sort((a,b)=>b[0].length-a[0].length).forEach(([from,to])=>{
      out = out.split(from).join(to);
    });
    return out;
  }

  function fixBadRepeats(){
    document.querySelectorAll("body *").forEach(el=>{
      if(el.children.length === 0 && el.textContent){
        let t = el.textContent;
        if((t.match(/Sloní noha/g)||[]).length > 2 || (t.match(/Elephant foot/g)||[]).length > 2){
          el.textContent = currentLang()==="en" ? "Elephant foot" : "Sloní noha (Elephant foot)";
        }
      }
    });
  }

  function applyLang(){
    const list = currentLang()==="en" ? csToEn : enToCs;

    document.querySelectorAll("body *").forEach(el=>{
      if(["SCRIPT","STYLE","TEXTAREA","PRE","CODE"].includes(el.tagName)) return;

      if(el.children.length === 0 && el.textContent){
        const next = replaceList(el.textContent, list);
        if(next !== el.textContent) el.textContent = next;
      }

      ["placeholder","title","aria-label"].forEach(attr=>{
        if(el.hasAttribute && el.hasAttribute(attr)){
          const old = el.getAttribute(attr);
          const next = replaceList(old, list);
          if(next !== old) el.setAttribute(attr,next);
        }
      });
    });

    fixBadRepeats();
  }

  window.addEventListener("DOMContentLoaded", function(){
    applyLang();
    setTimeout(applyLang, 200);

    document.addEventListener("click", function(e){
      if(e.target.closest(".lang button,.lang-btn,#lcs,#len")){
        setTimeout(applyLang, 120);
      }
    }, true);
  });
})();
</script>


<script id="pg-v53-short-ai-safe">
(function(){
  const compactCZ = "\n\nDŮLEŽITÉ: Odpověz krátce a prakticky. Maximálně 1200 znaků. Struktura: 1) Pravděpodobná příčina, 2) Doporučené hodnoty, 3) 3 rychlé kroky, 4) max 2 doplňující otázky. Nepiš dlouhou teorii.";
  const compactEN = "\n\nIMPORTANT: Answer briefly and practically. Maximum 1200 characters. Structure: 1) Most likely cause, 2) Recommended values, 3) 3 quick steps, 4) max 2 follow-up questions. Do not write long theory.";

  const originalFetch = window.fetch;
  window.fetch = function(input, init){
    try{
      const url = typeof input === "string" ? input : (input && input.url ? input.url : "");
      if(init && init.body && typeof init.body === "string" && (url.includes("/api/analyze") || url.includes("/.netlify/functions/analyze"))){
        const data = JSON.parse(init.body);
        const lang = (window.lang === "en" || document.documentElement.lang === "en") ? "en" : "cs";
        const compact = lang === "en" ? compactEN : compactCZ;

        if(Array.isArray(data.messages)){
          let lastUser = -1;
          data.messages.forEach((m, i) => {
            if(m && m.role === "user") lastUser = i;
          });
          if(lastUser >= 0){
            const c = String(data.messages[lastUser].content || "");
            if(!c.includes("Maximálně 1200 znaků") && !c.includes("Maximum 1200 characters")){
              data.messages[lastUser].content = c + compact;
            }
          }
        }

        if(typeof data.max_tokens === "number" && data.max_tokens > 850) data.max_tokens = 850;
        if(typeof data.max_output_tokens === "number" && data.max_output_tokens > 850) data.max_output_tokens = 850;

        init = Object.assign({}, init, { body: JSON.stringify(data) });
      }
    }catch(e){}
    return originalFetch.call(this, input, init);
  };
})();
</script>
