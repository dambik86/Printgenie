// ── Render ──

function escH(t){if(t==null)return"";var d=document.createElement("div");d.textContent=String(t);return d.innerHTML;}

function statusLabel(s){
  return {current:"Aktuální",legacy:"Legacy",superseded:"Nahrazen","DIY-active":"DIY"}[s] || s;
}

function statusClass(s){
  return {current:"tag-current",legacy:"tag-legacy",superseded:"tag-superseded","DIY-active":"tag-diy"}[s] || "";
}

function renderPrinter(name){
  var p = PRINTER_DB[name];
  if(!p){
    document.getElementById("content").innerHTML = 
      '<div class="notfound">' +
      '<h1>Tiskárna nenalezena</h1>' +
      '<p>Pro tiskárnu "'+escH(name)+'" zatím nemáme detailní profil.</p>' +
      '<p>Můžeš ji použít v PrintGenie nástrojích — diagnóza i Slicer Profiler s ní fungují.</p>' +
      '<a class="hero-btn hero-btn-primary" href="/">Zpět na PrintGenie</a>' +
      '</div>';
    return;
  }

  // Update page title and description for SEO
  document.title = name + " — Specifikace a problémy | PrintGenie";
  document.getElementById("page-desc").content = name + ": " + (p.notes || "") + " Specs, známé problémy, doporučené upgrady, AI diagnostika zdarma.";

  var build = Array.isArray(p.build) && p.build.length >= 3 ? 
    p.build[0]+"×"+p.build[1]+"×"+p.build[2]+" mm" : "—";

  var html = '<div class="hero">';
  html += '<div class="hero-meta">';
  html += '<span>'+p.country+' '+escH(p.brand)+'</span>';
  html += '<span>'+escH(p.type)+'</span>';
  html += '<span>'+p.year+'</span>';
  html += '<span class="'+statusClass(p.status)+'">'+statusLabel(p.status)+'</span>';
  if(p.price_eur) html += '<span>~'+p.price_eur+' EUR</span>';
  html += '</div>';
  
  html += '<h1 class="hero-title">'+escH(name)+'</h1>';
  if(p.notes) html += '<p class="hero-sub">'+escH(p.notes)+'</p>';
  
  html += '<div class="hero-cta">';
  html += '<a class="hero-btn hero-btn-primary" href="/#s-doc">📸 Zkontroluj svůj fail</a>';
  html += '<a class="hero-btn" href="/#s-prof">⚙️ Vygenerovat slicer profil</a>';
  html += '<a class="hero-btn" href="/#s-ai">💬 Zeptat se AI</a>';
  html += '</div>';
  html += '</div>';

  // Specs grid
  html += '<div class="specs">';
  html += '<div class="spec"><div class="spec-lbl">BUILD VOLUME</div><div class="spec-val">'+build+'</div></div>';
  html += '<div class="spec"><div class="spec-lbl">KINEMATIKA</div><div class="spec-val">'+escH(p.kinematics)+'</div></div>';
  html += '<div class="spec"><div class="spec-lbl">HOTEND</div><div class="spec-val">'+escH(p.hotend)+'</div></div>';
  html += '<div class="spec"><div class="spec-lbl">MAX TRYSKA</div><div class="spec-val">'+p.nozzle_max+'°C</div></div>';
  html += '<div class="spec"><div class="spec-lbl">MAX PODLOŽKA</div><div class="spec-val">'+p.bed_max+'°C</div></div>';
  if(p.speeds && p.speeds.max_print){
    html += '<div class="spec"><div class="spec-lbl">MAX RYCHLOST</div><div class="spec-val">'+p.speeds.max_print+' mm/s</div></div>';
  }
  if(p.speeds && p.speeds.max_accel){
    html += '<div class="spec"><div class="spec-lbl">MAX AKCELERACE</div><div class="spec-val">'+p.speeds.max_accel+' mm/s²</div></div>';
  }
  html += '</div>';

  // Materials
  if(p.materials && p.materials.length){
    html += '<div class="section">';
    html += '<div class="section-title">PODPOROVANÉ MATERIÁLY</div>';
    html += '<div class="tags">';
    p.materials.forEach(function(m){
      html += '<span class="tag tag-mat">'+escH(m)+'</span>';
    });
    html += '</div></div>';
  }

  // Features
  if(p.features && p.features.length){
    html += '<div class="section">';
    html += '<div class="section-title">FUNKCE</div>';
    html += '<div class="tags">';
    p.features.forEach(function(f){
      html += '<span class="tag tag-feat">'+escH(f)+'</span>';
    });
    html += '</div></div>';
  }

  // Bed surfaces
  if(p.bed_surface && p.bed_surface.length){
    html += '<div class="section">';
    html += '<div class="section-title">PODLOŽKY</div>';
    html += '<div class="tags">';
    p.bed_surface.forEach(function(b){
      html += '<span class="tag">'+escH(b)+'</span>';
    });
    html += '</div></div>';
  }

  // Pros & Cons
  if((p.pros && p.pros.length) || (p.cons && p.cons.length)){
    html += '<div class="section">';
    html += '<div class="section-title">PRO A PROTI</div>';
    html += '<div class="pros-cons">';
    if(p.pros){
      html += '<div class="pros">';
      html += '<div class="pros-cons-title">VÝHODY</div>';
      html += '<ul>';
      p.pros.forEach(function(x){html += '<li>'+escH(x)+'</li>';});
      html += '</ul></div>';
    }
    if(p.cons){
      html += '<div class="cons">';
      html += '<div class="pros-cons-title">NEVÝHODY</div>';
      html += '<ul>';
      p.cons.forEach(function(x){html += '<li>'+escH(x)+'</li>';});
      html += '</ul></div>';
    }
    html += '</div></div>';
  }

  // Known issues
  if(p.issues && p.issues.length){
    html += '<div class="section">';
    html += '<div class="section-title">ZNÁMÉ PROBLÉMY</div>';
    p.issues.forEach(function(iss){
      html += '<div class="issue">';
      html += '<div class="issue-title">⚠️ '+escH(iss.issue)+'</div>';
      html += '<div class="issue-cause"><strong>Příčina:</strong> '+escH(iss.causes)+'</div>';
      html += '<div class="issue-fix"><strong>Oprava:</strong> '+escH(iss.fix)+'</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Upgrades
  if(p.upgrades && p.upgrades.length){
    html += '<div class="section">';
    html += '<div class="section-title">DOPORUČENÉ UPGRADY</div>';
    html += '<div class="upgrades">';
    p.upgrades.forEach(function(u){
      html += '<span class="upgrade">⚡ '+escH(u)+'</span>';
    });
    html += '</div></div>';
  }

  // AI ask box
  html += '<div class="ai-box">';
  html += '<div class="ai-box-title">Máš s touhle tiskárnou problém?</div>';
  html += '<div class="ai-box-sub">PrintGenie ti pomůže — diagnóza z fotky, slicer profil, AI chat. Vše zdarma.</div>';
  html += '<div class="ai-box-buttons">';
  html += '<a class="hero-btn hero-btn-primary" href="/#s-doc">📸 Nahrát fotku failu</a>';
  html += '<a class="hero-btn" href="/#s-ai">💬 Zeptat se AI</a>';
  html += '</div></div>';

  document.getElementById("content").innerHTML = html;
}

if(printerName){
  renderPrinter(printerName);
} else {
  // List all printers
  var html = '<h1 style="font-size:36px;color:#fff;margin-bottom:20px">Encyklopedie tiskáren</h1>';
  html += '<p style="color:#b4b4d0;margin-bottom:28px">Detailní profily, specifikace a známé problémy 3D tiskáren.</p>';
  
  // Group by brand
  var brands = {};
  Object.keys(PRINTER_DB).forEach(function(name){
    var b = PRINTER_DB[name].brand;
    if(!brands[b]) brands[b] = [];
    brands[b].push(name);
  });
  
  Object.keys(brands).forEach(function(brand){
    html += '<div class="section">';
    html += '<div class="section-title">'+escH(brand)+'</div>';
    html += '<div class="specs">';
    brands[brand].forEach(function(name){
      var p = PRINTER_DB[name];
      html += '<a class="spec" style="display:block;text-decoration:none;cursor:pointer" href="/printer.html?p='+encodeURIComponent(name)+'">';
      html += '<div class="spec-lbl">'+statusLabel(p.status).toUpperCase()+' · '+p.year+'</div>';
      html += '<div class="spec-val" style="font-size:14px">'+escH(name)+'</div>';
      html += '<div class="spec-sub">'+escH(p.type)+' · ~'+p.price_eur+' EUR</div>';
      html += '</a>';
    });
    html += '</div></div>';
  });
  
  document.getElementById("content").innerHTML = html;
  document.title = "Encyklopedie 3D tiskáren — PrintGenie";
}
</script>
</body>
</html>
